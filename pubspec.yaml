name: flutter_boilerplate
description: Production-ready Flutter boilerplate with Riverpod, GoRouter, Dio, secure storage, and optional Firebase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # App foundation
  flutter_riverpod: ^3.3.2
  go_router: ^18.0.0
  equatable: ^2.1.0
  intl: ^0.20.2

  # Networking
  dio: ^5.10.0
  connectivity_plus: ^7.2.0

  # Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0

  # Firebase (optional until configured with FlutterFire CLI)
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.3.0

  # Utilities
  json_annotation: ^4.12.0
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
