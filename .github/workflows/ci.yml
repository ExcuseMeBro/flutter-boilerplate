name: Flutter checks

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLUTTER_VERSION: '3.47.9'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
      - name: Locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
      - name: Bootstrap tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Android debug build (no production signing)
        run: flutter build apk --debug --no-pub
      - name: Check generated files and lockfile stayed current
        run: git diff --exit-code -- pubspec.lock lib/l10n
