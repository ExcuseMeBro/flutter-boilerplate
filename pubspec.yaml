name: flutter_boilerplate
description: Production-ready Flutter boilerplate with Riverpod, GoRouter, Dio, secure storage, and optional Firebase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # App foundation
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  equatable: ^2.0.7
  intl: ^0.20.2

  # Networking
  dio: ^5.9.2
  connectivity_plus: ^7.1.1

  # Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0

  # Firebase (optional until configured with FlutterFire CLI)
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0

  # Utilities
  json_annotation: ^4.11.0
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
