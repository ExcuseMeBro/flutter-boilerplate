name: flutter_boilerplate
description: Production-ready Flutter boilerplate with Riverpod, GoRouter, Dio, secure storage, and optional Firebase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # App foundation
  flutter_riverpod: ^3.3.2
  go_router: ^18.0.0
  intl: ^0.20.2

  # Networking
  dio: ^5.10.0

  # Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0

  # Firebase (optional until configured with FlutterFire CLI)
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Supplies the in-memory SharedPreferencesAsync platform for tests.
  shared_preferences_platform_interface: ^2.4.1

flutter:
  uses-material-design: true
  generate: true
